<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40" role="img" aria-label="divider">
<style>
.steam{opacity:0;animation:steam 3.6s ease-in-out infinite}
.s2{animation-delay:1.2s}.s3{animation-delay:2.4s}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}35%{opacity:.95}100%{opacity:0;transform:translateY(-24px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,91%,97%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.55);opacity:.45}50%{transform:scale(1);opacity:1}}
.float{animation:float 3.8s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bob{animation:bob 3.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
.tail{transform-origin:888px 150px;animation:wag 2.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.breathe{transform-origin:515px 113px;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.045)}}
.z{opacity:0;animation:z 3.6s ease-in-out infinite}
.z2{animation-delay:1.2s}.z3{animation-delay:2.4s}
@keyframes z{0%{opacity:0;transform:translate(0,8px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.steam,.z{opacity:.8}}
</style>
<path d="M60 20H440" stroke="#4A3830" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 14"/><path d="M560 20H940" stroke="#4A3830" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 14"/>
<g class="twinkle"><path transform="translate(466 20) scale(1.3)" fill="#F2A7B8" d="M0 3.2C-4.2 0.2-6.4-3.2-4.4-5.6C-2.9-7.3-0.8-6.8 0-5C0.8-6.8 2.9-7.3 4.4-5.6C6.4-3.2 4.2 0.2 0 3.2Z"/></g><g fill="#C08A62" transform="translate(500 20)"><ellipse cx="0" cy="3.5" rx="7.2" ry="6"/><circle cx="-8.4" cy="-4.2" r="3.1"/><circle cx="-3" cy="-9" r="3.1"/><circle cx="3" cy="-9" r="3.1"/><circle cx="8.4" cy="-4.2" r="3.1"/></g>
<g class="twinkle" style="animation-delay:1.3s"><path transform="translate(534 20) scale(1.3)" fill="#F2A7B8" d="M0 3.2C-4.2 0.2-6.4-3.2-4.4-5.6C-2.9-7.3-0.8-6.8 0-5C0.8-6.8 2.9-7.3 4.4-5.6C6.4-3.2 4.2 0.2 0 3.2Z"/></g>
</svg>
